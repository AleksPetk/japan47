server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # index.html must revalidate so deployments are visible immediately, while
    # Vite's content-hashed bundles can be cached for a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /spa.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    # Serve prerendered path/index.html at /path without a trailing-slash 301.
    # Unknown SPA routes fall back to spa.html (clean shell) — never the
    # homepage index.html, which used to pollute contributor URLs with identical
    # prerendered geography content and cause Google duplicate-canonical issues.
    # Avoid `$uri/` — that directory probe is what forced /regions → /regions/.
    location / { try_files $uri $uri/index.html /spa.html; }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
}
