server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # index.html must revalidate so deployments are visible immediately, while
    # Vite's content-hashed bundles can be cached for a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://analytics.alekspetk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://analytics.alekspetk.com" always;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
}
