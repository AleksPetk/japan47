# Service names resolve through Docker's private network; neither application
# container needs a public host port.
upstream django_api { server backend:8000; }
upstream react_frontend { server frontend:80; }

# Host Nginx terminates HTTPS and forwards to this container over loopback
# HTTP. Preserve its trusted HTTPS marker; local Docker requests without that
# header continue to use this Nginx server's own HTTP scheme.
map $http_x_forwarded_proto $j47_forwarded_proto {
    https https;
    default $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 9m;

    # Browser protections are applied at the public edge so they cover React,
    # API errors, media, Swagger, and Django admin consistently.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://analytics.alekspetk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://analytics.alekspetk.com" always;

    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $j47_forwarded_proto;
        proxy_read_timeout 65s;
    }
    # The official Nginx image substitutes only DJANGO_ADMIN_PATH at startup.
    location /${DJANGO_ADMIN_PATH} {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $j47_forwarded_proto;
    }
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }
    # Dynamic Django sitemap so newly published places appear without a
    # frontend rebuild. Keep this ahead of the React catch-all.
    location = /sitemap.xml {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $j47_forwarded_proto;
    }
    # Canonicalize public HTML URLs to the no-trailing-slash form used by
    # React Router, prerender output, and sitemap entries. API/admin/media/
    # static paths are excluded because Django and aliases expect them.
    # Use the trusted forwarded proto so TLS terminators do not produce
    # http:// Location headers on https:// requests.
    location ~ "^/(?!api/|media/|static/|${DJANGO_ADMIN_PATH})(.+)/$" {
        return 301 $j47_forwarded_proto://$host/$1$is_args$args;
    }
    location / {
        proxy_pass http://react_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $j47_forwarded_proto;
    }
}
